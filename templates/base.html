<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title} — My Weblog</title>
  <link rel="stylesheet" href="style.css">
  {extra_head}
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="header-row">
        <a href="/" class="site-title">My Weblog</a>
        <div class="search-wrap">
          <input type="text" class="search-input" placeholder="Type then click Search" id="searchInput" autocomplete="off">
          <button class="search-btn" id="searchBtn">Search</button>
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="content-shell">
      <div class="page-layout">
        <div class="main-column">
          {content}
        </div>

        <aside class="sidebar">
          <div class="sidebar-section">
            <h3>About</h3>
            <p class="sidebar-description">Developer based in [Your City]. I work on [what you do]. This is where I share notes, links, and occasional writing.</p>
          </div>

          <div class="sidebar-section">
            <h3>All Posts</h3>
            {archive}
          </div>

          <div class="sidebar-section">
            <h3>Elsewhere</h3>
            <ul>
              <li><a href="https://github.com" class="external">GitHub</a></li>
              <li><a href="#" class="external">Twitter / X</a></li>
              <li><a href="#" class="external">Bluesky</a></li>
            </ul>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>Powered by HTML &amp; CSS &middot; Hosted on <a href="https://pages.github.com">GitHub Pages</a></p>
    </div>
  </footer>

  <script src="search.js"></script>
</body>
</html>
